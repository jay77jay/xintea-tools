/* ---------- 工具 ---------- */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const today = () => new Date(Date.now() + 8*3600e3).toISOString().slice(0,10);
const num = v => { const n = Number(v); return Number.isFinite(n) ? n : 0; };
const md = d => d ? d.slice(5).replace('-','/') : '';
/** 「心茶禮盒生產單_代開-20260824-2」→ 20260824-2 */
const stripNo = s => { const m = String(s || '').match(/\d{8}-\d+/); return m ? m[0] : String(s || '').replace(/[^\w-]/g, ''); };
const normPo = s => { const m = String(s || '').match(/(\d{3,})/); return m ? 'PO-' + m[1].padStart(4, '0') : ''; };
const noDate = n => { const m = stripNo(n).match(/^(\d{4})(\d{2})(\d{2})/); return m ? `${m[1]}-${m[2]}-${m[3]}` : ''; };
const srcOf = p => p.src || [];
const alertKey = a => a.at + '|' + a.text;
/** 已入帳月份標籤：billedManual 可為 true 或 '2026-10' */
const billedLabel = v => { const m = String(v).match(/^\d{4}-(\d{2})$/); return m ? `已入${+m[1]}月帳` : '已入帳'; };

/** 每張採購單的衍生資訊 */
function meta(p){
  const src = srcOf(p);
  const added = p.addedAt || src.map(s => s.addedAt || noDate(s.prodNo)).filter(Boolean).sort()[0] || (p.prodNos||[]).map(noDate).sort()[0] || '';
  const arrive = src.map(s => s.earliest).filter(Boolean).sort()[0] || '';
  const custom = src.some(s => s.custom);
  const acked = new Set(p.ack || []);
  const alerts = src.flatMap(s => s.alerts || []).concat(p.alerts || []).filter(a => !acked.has(alertKey(a)));
  const lastChange = src.map(s => s.changeDate).concat((p.alerts||[]).map(a => a.at)).filter(Boolean).sort().pop() || '';
  const billed = src.filter(s => s.billedManual);
  return {added, arrive, custom, alerts, lastChange, billedAll: src.length && billed.length === src.length, billedSome: billed.length > 0, billedTag: billed.length ? billedLabel(billed[0].billedManual) : ''};
}
/** ERP 工序登記用單號：只列沒有手動入帳的生產單號；沒有生產單號才用配送單號 */
function erpNo(p){
  const src = srcOf(p);
  const pn = src.length ? src.filter(s => !s.billedManual).map(s => stripNo(s.prodNo)) : (p.prodNos || []).map(stripNo);
  const u = [...new Set(pn.filter(Boolean))];
  if (u.length) return u.join(' ');
  const s = [...new Set((p.shipNos || []).map(stripNo).filter(Boolean))];
  return s.length ? s.join(' ') : p.po;
}
function boxTotals(boxes){
  let handling = 0; const cartons = {};
  for (const b of BOX_TYPES){ const v = num((boxes || {})[b.k]); handling += v; if (b.carton && v) cartons[b.k] = v; }
  return {handling, cartons};
}
/** 一張生產單的茶包/茶點用量：有生產單用料就用生產單，否則 BOM × 盒數（套用異動簡述的「A 換 B」） */
function matOf(s){
  if (s.mat) return {from:'生產單', map: Object.fromEntries(Object.entries(s.mat).filter(([c]) => BOM.materials[c]).map(([c,v]) => [c, num(v)])),
    unknown: Object.keys(s.mat).filter(c => !BOM.materials[c])};
  const b = BOM.boms[s.sku];
  if (!b) return {from:'無BOM', map:{}, unknown:[]};
  const per = Object.assign({}, b.items);
  for (const m of String(s.changeText || '').matchAll(/([A-Z]{1,2}\d{5,7})\s*換\s*([A-Z]{1,2}\d{5,7})/g)){
    if (per[m[1]] != null){ per[m[2]] = (per[m[2]] || 0) + per[m[1]]; delete per[m[1]]; }
  }
  return {from:'BOM估算', map: Object.fromEntries(Object.entries(per).map(([c,v]) => [c, v * num(s.qty)])), unknown:[]};
}

/* ---------- 資料層（Firestore 或試用模式） ---------- */
const DEMO = !LIVE_HOSTS.includes(location.hostname);
let db = null, user = null;
const Store = {
  cache: {},
  async loadAll(){
    if (DEMO){ this.cache = JSON.parse(JSON.stringify(DEMO_DATA)); return; }
    const snap = await db.collection(COL_PO).get();
    this.cache = {}; snap.forEach(d => this.cache[d.id] = d.data());
  },
  async get(po){
    if (!DEMO){ const d = await db.collection(COL_PO).doc(po).get(); if (d.exists) this.cache[po] = d.data(); else delete this.cache[po]; }
    return this.cache[po] || null;
  },
  async save(po, data){
    data.updatedAt = new Date().toISOString();
    if (!DEMO) await db.collection(COL_PO).doc(po).set(data, {merge:true});
    this.cache[po] = Object.assign(this.cache[po] || {}, data);
  },
  list(){ return Object.values(this.cache).sort((a,b) => (b.po||'').localeCompare(a.po||'')); }
};

/* ---------- 啟動 ---------- */
async function boot(){
  if (DEMO){
    $('demoBar').classList.remove('hidden'); $('who').textContent = '試用模式';
    await Store.loadAll(); route(); return;
  }
  firebase.initializeApp(firebaseConfig);
  db = firebase.firestore();
  firebase.auth().onAuthStateChanged(async u => {
    user = u;
    if (!u){ $('login').classList.remove('hidden'); hideViews(); $('who').textContent = ''; return; }
    $('login').classList.add('hidden'); $('who').textContent = u.displayName || u.email;
    try { await Store.loadAll(); } catch(e){ showErr('讀取資料失敗：' + e.message); return; }
    route();
  });
  $('btnLogin').onclick = () => firebase.auth().signInWithPopup(new firebase.auth.GoogleAuthProvider())
    .catch(() => firebase.auth().signInWithRedirect(new firebase.auth.GoogleAuthProvider()));
}
const VIEWS = ['report','mat','month','admin'];
function hideViews(){ VIEWS.forEach(v => $('v-' + v).classList.add('hidden')); }
function showErr(t){ $('v-report').innerHTML = `<div class="msg err">${esc(t)}</div>`; $('v-report').classList.remove('hidden'); }
let VIEW = 'report', REPORT_SEEN = false, SORT = 'arrive';
document.querySelectorAll('#nav button').forEach(b => b.onclick = () => { VIEW = b.dataset.v; route(); });
function route(){
  document.querySelectorAll('#nav button').forEach(b => b.classList.toggle('on', b.dataset.v === VIEW));
  hideViews(); $('v-' + VIEW).classList.remove('hidden');
  if (VIEW === 'report'){ const q = new URLSearchParams(location.search).get('po'); if (q && !REPORT_SEEN){ REPORT_SEEN = true; openForm(normPo(q)); } else renderList(); }
  if (VIEW === 'mat') renderMat();
  if (VIEW === 'month') renderMonth();
  if (VIEW === 'admin') renderAdmin();
}

const SORTS = {
  arrive: {label:'最早到貨日', fn:(a,b) => (a.m.arrive||'9999').localeCompare(b.m.arrive||'9999') || a.p.po.localeCompare(b.p.po)},
  added:  {label:'新增日期',   fn:(a,b) => (b.m.added||'').localeCompare(a.m.added||'') || b.p.po.localeCompare(a.p.po)},
  change: {label:'異動',       fn:(a,b) => (b.m.alerts.length > 0) - (a.m.alerts.length > 0) || (b.m.lastChange||'').localeCompare(a.m.lastChange||'') || (a.m.arrive||'').localeCompare(b.m.arrive||'')}
};
function renderList(){
  const el = $('v-report');
  el.innerHTML = `<div class="card">
      <h2>選擇採購單</h2>
      <input id="q" placeholder="搜尋：採購單號、客戶、料號、生產單號" autocomplete="off">
      <div class="sortbar"><span class="mut">排序：</span>${Object.entries(SORTS).map(([k,v]) => `<button data-s="${k}" class="${SORT===k?'on':''}">${v.label}</button>`).join('')}</div>
      <p class="mut" style="margin:8px 0 0">掃採購單上的 QR 碼會直接打開該單。紅框＝生產單有異動，橘邊＝客製化。</p>
    </div>
    <div id="listOpen"></div>
    <h3>最近已回報（可點開修改）</h3><div id="listDone"></div>`;
  el.querySelectorAll('.sortbar button').forEach(b => b.onclick = () => { SORT = b.dataset.s; el.querySelectorAll('.sortbar button').forEach(x => x.classList.toggle('on', x === b)); draw(); });
  const draw = () => {
    const q = $('q').value.trim().toLowerCase();
    const hit = p => !q || [p.po, p.customer, p.ref, ...(p.lines||[]).map(l => l.sku), ...srcOf(p).map(s => s.prodNo)].join(' ').toLowerCase().includes(q);
    const all = Store.list().filter(hit).map(p => ({p, m: meta(p)}));
    const open = all.filter(x => x.p.status !== 'done').sort(SORTS[SORT].fn);
    const done = all.filter(x => x.p.status === 'done').sort((a,b) => (b.p.done?.at||'').localeCompare(a.p.done?.at||'')).slice(0, 20);
    $('listOpen').innerHTML = open.length ? open.map(itemHtml).join('') : '<p class="mut">沒有待回報的採購單。</p>';
    $('listDone').innerHTML = done.length ? done.map(itemHtml).join('') : '<p class="mut">還沒有回報紀錄。</p>';
    el.querySelectorAll('.po-item').forEach(b => b.onclick = () => openForm(b.dataset.po));
  };
  $('q').oninput = draw; draw();
}
function itemHtml({p, m}){
  const qty = (p.lines||[]).reduce((s,l) => s + num(l.qty), 0);
  const st = p.status === 'done' ? `<span class="tag ok">已完成 ${esc(md(p.done?.date))}</span>` : `<span class="tag wait">待回報</span>`;
  const al = m.alerts.length ? `<div class="alertbar">⚠ 生產單異動 ${m.alerts.length} 項：${esc(m.alerts[0].text.replace(/^生產單 \S+ 列印後有異動：/, ''))}${m.alerts.length > 1 ? '…' : ''}</div>` : '';
  return `<button class="po-item${m.alerts.length ? ' alert' : ''}${m.custom ? ' cus' : ''}" data-po="${esc(p.po)}">${al}<div class="in">
    <b>${esc(p.po)}</b>${st}${m.custom ? '<span class="tag cus">客製</span>' : ''}${m.billedAll ? `<span class="tag billed">${m.billedTag}</span>` : m.billedSome ? `<span class="tag billed">部分${m.billedTag}</span>` : ''}<br>
    <span>${esc(p.customer||'')}</span> · <span class="mut">${(p.lines||[]).map(l => esc(l.sku) + '×' + l.qty).join('、')}（共 ${qty}）</span>
    <div class="meta"><span>新增 <b>${esc(m.added || '—')}</b></span><span>最早到貨 <b>${esc(md(m.arrive) || '—')}</b></span><span>製作 ${esc(md(p.date))}</span></div>
  </div></button>`;

/* ---------- 用料（目前總需要） ---------- */
let MAT_GROUP_SEL = 'all', MAT_OPEN = {};
function matData(toDate){
  const need = {}, missing = {}, unknown = {};
  let poCnt = 0, boxCnt = 0, fromProd = 0, fromBom = 0;
  const open = Store.list().filter(p => p.status !== 'done');
  for (const p of open){
    let used = false;
    for (const s of srcOf(p)){
      if (toDate && s.earliest && s.earliest > toDate) continue;
      used = true; boxCnt += num(s.qty);
      const mt = matOf(s);
      if (mt.from === '無BOM'){ (missing[s.sku] = missing[s.sku] || []).push(`${p.po} ${stripNo(s.prodNo)}×${s.qty}`); continue; }
      mt.from === '生產單' ? fromProd++ : fromBom++;
      mt.unknown.forEach(c => (unknown[c] = unknown[c] || new Set()).add(p.po));
      for (const [c, q] of Object.entries(mt.map)){
        if (!q) continue;
        const n = need[c] = need[c] || {code:c, qty:0, prod:0, bom:0, rows:[]};
        n.qty += q; mt.from === '生產單' ? n.prod += q : n.bom += q;
        n.rows.push({po:p.po, customer:p.customer, prodNo:stripNo(s.prodNo), sku:s.sku, box:s.qty, qty:q, from:mt.from, earliest:s.earliest});
      }
    }
    if (used) poCnt++;
  }
  const done = Store.list().filter(p => p.status === 'done');
  return {need, missing, unknown, poCnt, boxCnt, fromProd, fromBom, doneCnt: done.length};
}
function renderMat(){
  const el = $('v-mat');
  el.innerHTML = `<div class="card"><h2>目前總需要用料（茶點、茶包）</h2>
    <p class="mut" style="margin-top:0">只算還沒回報完成的採購單；回報完成後會自動扣掉。有下載生產單的用生產單實際用料（含客製改料），還沒有的先用 BOM 估算。</p>
    <div class="row"><div><label class="mut">最早到貨日在這天以前（空白＝全部）</label><input type="date" id="mTo"></div>
    <div><label class="mut">顯示</label><select id="mGrp"><option value="all">全部</option><option value="餅乾">只看茶點（餅乾類）</option><option value="茶包">只看茶包</option></select></div></div>
    <div id="mRes"></div></div>`;
  $('mGrp').value = MAT_GROUP_SEL;
  const draw = () => {
    MAT_GROUP_SEL = $('mGrp').value;
    const r = matData($('mTo').value);
    const rows = Object.values(r.need).map(n => Object.assign(n, BOM.materials[n.code]))
      .filter(n => MAT_GROUP_SEL === 'all' || MAT_GROUP[n.cat] === MAT_GROUP_SEL)
      .sort((a,b) => (MAT_CAT_ORDER.indexOf(a.cat)+1||99) - (MAT_CAT_ORDER.indexOf(b.cat)+1||99) || b.qty - a.qty);
    let html = `<div class="msg ok">未完成 ${r.poCnt} 張採購單、${r.boxCnt} 盒；已回報完成 ${r.doneCnt} 張不列入。\n用料依據：生產單 ${r.fromProd} 張、BOM 估算 ${r.fromBom} 張。</div>`;
    if (Object.keys(r.missing).length) html += `<div class="msg warn">以下禮盒沒有 BOM，用料沒算進去：\n${Object.entries(r.missing).map(([k,v]) => `${k}：${v.join('、')}`).join('\n')}</div>`;
    if (Object.keys(r.unknown).length) html += `<div class="msg warn">生產單裡有不在 BOM 清單的料號，請確認是否為茶點／茶包：\n${Object.entries(r.unknown).map(([k,v]) => `${k}（${[...v].join('、')}）`).join('\n')}</div>`;
    html += `<div class="scroll"><table><tr><th>料號</th><th>品名</th><th class="n">需要</th><th class="n">生產單</th><th class="n">BOM估算</th></tr>`;
    let cat = null;
    for (const n of rows){
      if (n.cat !== cat){
        cat = n.cat;
        const sub = rows.filter(x => x.cat === cat).reduce((s,x) => s + x.qty, 0);
        html += `<tr class="cat"><td colspan="2">${esc(cat)}（${MAT_GROUP[cat] === '餅乾' ? '茶點' : '茶包'}）</td><td class="n">${sub}</td><td colspan="2"></td></tr>`;
      }
      html += `<tr class="mrow" data-c="${esc(n.code)}"><td>${esc(n.code)}</td><td>${esc(n.name)} <span class="mut">▸</span></td><td class="n"><b>${n.qty}</b></td><td class="n">${n.prod || ''}</td><td class="n">${n.bom || ''}</td></tr>`;
      if (MAT_OPEN[n.code]) html += n.rows.sort((a,b) => (a.earliest||'').localeCompare(b.earliest||'')).map(x =>
        `<tr class="det"><td>${esc(x.po)}</td><td>${esc(x.customer)}　${esc(x.prodNo)} ${esc(x.sku)}×${x.box}　到貨 ${esc(md(x.earliest))}</td><td class="n">${x.qty}</td><td colspan="2">${x.from}</td></tr>`).join('');
    }
    html += rows.length ? '' : '<tr><td colspan="5" class="mut">沒有需要的料。</td></tr>';
    html += '</table></div>';
    $('mRes').innerHTML = html;
    $('mRes').querySelectorAll('.mrow').forEach(tr => tr.onclick = () => { MAT_OPEN[tr.dataset.c] = !MAT_OPEN[tr.dataset.c]; draw(); });
  };
  $('mTo').onchange = draw; $('mGrp').onchange = draw; draw();
}

/* ---------- 月底清單 ---------- */
function monthData(ym){
  const done = Store.list().filter(p => p.status === 'done' && (p.done?.date || '').startsWith(ym))
    .sort((a,b) => (a.done.date + a.po).localeCompare(b.done.date + b.po));
  const sysRows = [], erpRows = [], skipped = [];
  for (const p of done){
    const src = srcOf(p);
    const billedQty = {};
    src.filter(s => s.billedManual).forEach(s => billedQty[s.sku] = (billedQty[s.sku]||0) + num(s.qty));
    const allBilled = src.length && src.every(s => s.billedManual);
    if (allBilled){ skipped.push(p.po); continue; }
    for (const l of p.done.lines || []){
      const q = Math.max(0, num(l.qty) - (billedQty[l.sku] || 0));
      if (q > 0) sysRows.push({sku:l.sku, name:l.name || (p.lines||[]).find(x => x.sku === l.sku)?.name || '', qty:q, po:p.po, date:p.done.date});
    }
    const t = boxTotals(p.done.boxes);
    erpRows.push({date:p.done.date, no:erpNo(p), po:p.po, customer:p.customer||'', handling:t.handling, cartons:t.cartons, boxes:p.done.boxes||{}, note:p.done.note||'', partial: Object.keys(billedQty).length > 0});
  }
  const skuSum = {};
  sysRows.forEach(r => { skuSum[r.sku] = skuSum[r.sku] || {sku:r.sku, name:r.name, qty:0}; skuSum[r.sku].qty += r.qty; });
  const tot = {handling: erpRows.reduce((s,r) => s + r.handling, 0), cartons: {}};
  erpRows.forEach(r => Object.entries(r.cartons).forEach(([k,v]) => tot.cartons[k] = (tot.cartons[k]||0) + v));
  const pending = Store.list().filter(p => p.status !== 'done' && (p.date || '') <= ym + '-31');
  return {done, sysRows, erpRows, skipped, skuSum: Object.values(skuSum).sort((a,b) => a.sku.localeCompare(b.sku)), tot, pending};
}

    XLSX.writeFile(wb, `心茶B2B月底清單_${ym}.xlsx`);
  };

/** 新增或更新採購單基本資料（含 src 生產單明細；不覆蓋 done / ack） */
window.b2bUpsertPOs = async function(list){
  const out = {added:0, updated:0};
  for (const x of list){
    const po = normPo(x.po); if (!po) continue;
    const exist = Store.cache[po];
    const base = {po, sgId:x.sgId||null, ref:x.ref||'', customer:x.customer||'', date:x.date||'', prodNos:x.prodNos||[], shipNos:x.shipNos||[],
      src:x.src||[], lines:(x.lines||[]).map(l => ({sku:l.sku, name:l.name||'', qty:num(l.qty)}))};
    if (x.addedAt) base.addedAt = x.addedAt;
    if (!exist) base.status = 'open';
    await Store.save(po, base); exist ? out.updated++ : out.added++;
  }
  return out;
};
window.b2bMarkSynced = async function(po, kind){ const p = Store.cache[normPo(po)]; if (!p) return false; await Store.save(p.po, {sync: Object.assign({}, p.sync, {[kind]: true})}); return true; };
window.b2bPending = () => Store.list().filter(p => p.status === 'done' && (!p.sync?.sg || !p.sync?.sheet)).map(p => ({po:p.po, sgId:p.sgId, done:p.done, prodNos:p.prodNos, sync:p.sync}));
window.b2bReload = () => Store.loadAll();
